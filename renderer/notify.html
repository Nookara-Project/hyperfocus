<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Hyperfocus Notifications</title>
<link rel="stylesheet" href="base.css">
<style>
  #stack { position: fixed; inset: 0; display: flex; flex-direction: column-reverse; gap: 10px; padding: 8px; }
  .nt {
    position: relative; display: flex; gap: 10px; padding: 10px 26px 12px 10px; overflow: hidden; cursor: pointer;
    background: var(--cream); border: 1px solid var(--vl-border); box-shadow: var(--vl-shadow);
    clip-path: inset(0 0 0 100%);
  }
  .nt.in { clip-path: none; animation: nt-reveal .6s cubic-bezier(.65, 0, .35, 1) backwards; }
  @keyframes nt-reveal { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0); } }
  @keyframes nt-hide { from { clip-path: inset(0); } to { clip-path: inset(0 0 0 100%); } }
  .nt-scan { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; z-index: 3; pointer-events: none; background: #fff;
    box-shadow: 0 0 8px 1px rgba(255, 255, 255, .85), 0 0 22px 4px var(--vl-glow);
    animation: nt-scan .6s cubic-bezier(.65, 0, .35, 1) forwards, vl-scan-off .25s .58s ease-out forwards; }
  .nt-scan.rev { animation: nt-scan-rev .32s cubic-bezier(.65, 0, .35, 1) forwards; }
  @keyframes nt-scan { from { left: 100%; } to { left: 0; } }
  @keyframes nt-scan-rev { from { left: 0; } to { left: 100%; } }
  html.no-anim .nt-scan { display: none; }
  .nt.out { clip-path: inset(0 0 0 100%); animation: nt-hide .32s cubic-bezier(.65, 0, .35, 1) forwards; }
  html.no-anim .nt.out { visibility: hidden; }
  .nt:hover { border-color: var(--k, var(--palegreen)); }
  .nt::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--k, var(--palegreen)); }
  .nt .pic-w { position: relative; flex: none; width: 48px; height: 48px; margin: 0 2px 0 3px; }
  .nt .pic { width: 100%; height: 100%; display: grid; place-items: center; object-fit: cover; border: 1px solid var(--gray); }
  .nt .pic-w.ring .pic { border: 2px solid var(--ring); box-shadow: 0 0 8px -2px var(--ring); }
  .nt .pic.pad-pic { background: var(--almostwhite); color: var(--k); }
  .nt .nt-acts { display: flex; gap: 6px; margin-top: 6px; }
  .nt .nt-btn { flex: 1; height: 26px; border: 1px solid var(--st-online); background: var(--st-online); color: #000; font: inherit; font-weight: 700; cursor: pointer; }
  .nt .nt-btn.no { background: transparent; border-color: var(--light-red); color: var(--light-red); }
  .nt .nt-btn:hover { filter: brightness(1.1); }
  .nt .pic.pad-pic svg { width: 34px; height: 34px; }
  .nt .badge {
    position: absolute; right: -7px; bottom: -7px; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; background: var(--k, var(--palegreen)); color: #11111b; border: 2px solid var(--cream);
  }
  .nt .badge svg { width: 12px; height: 12px; stroke-width: 2.4; }
  .nt .txt { min-width: 0; flex: 1; }
  .nt .kick { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--k, var(--palegreen)); }
  .nt .bd b { color: var(--st-playing); }
  .nt .ttl { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nt .bd {
    margin-top: 2px; font-size: 13px; white-space: pre-line; overflow-wrap: anywhere; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  }
  .nt .shot { display: block; width: 100%; margin-top: 7px; border: 1px solid var(--gray); }
  .nt .x { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border: 0; padding: 0; background: transparent; color: var(--lightbrown); display: grid; place-items: center; }
  .nt .x:hover { color: #fff; background: var(--light-red); }
  .nt .x svg { width: 12px; height: 12px; }
  .nt .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--k, var(--palegreen)); animation: shrink linear forwards; }
  .nt:hover .bar { animation-play-state: paused; }
  @keyframes shrink { from { width: 100%; } to { width: 0; } }
</style>
</head>
<body>
<div id="stack"></div>
<script src="icons.js"></script>
<script src="notify.js"></script>
</body>
</html>
