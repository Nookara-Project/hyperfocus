<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Hyperfocus Friends</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="profile-ui.css">
<link rel="stylesheet" href="mac.css">
<style>
  #frame {
    position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); border: 1px solid var(--vl-border); border-radius: 8px;
  }
  #frame > * { position: relative; z-index: 1; }
  #titlebar {
    flex: none; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 10px;
    background: rgba(14, 14, 16, .55); border-bottom: 1px solid var(--vl-border);
  }
  .tb-brand { display: flex; align-items: center; gap: 8px; }
  .tb-brand img { width: 20px; height: 20px; image-rendering: pixelated; }
  .tb-brand span { color: var(--lightbrown); }
  .tb-right { display: flex; gap: 4px; -webkit-app-region: no-drag; }
  #wrap { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px; }
  #side, #main { display: flex; flex-direction: column; min-height: 0; }
  #side { width: 250px; flex: none; }
  #people-root { overflow-y: auto; min-height: 0; padding: 6px; }
  #fr-list { flex: 1; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 3px; }
  .fr-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px; text-align: left; border: 1px solid transparent; background: transparent; color: var(--darkbrown); }
  .fr-row:hover { background: var(--orange); border-color: var(--gray); }
  .fr-row.on-profile { background: var(--almostwhite); border-color: var(--palegreen); }
  .fr-row.off { opacity: .6; }
  .fr-row .pfp { width: 30px; height: 30px; border: 2px solid var(--st-offline); }
  .fr-row .pfp.st-online { border-color: var(--st-online); }
  .fr-row .pfp.st-playing { border-color: var(--st-playing); box-shadow: 0 0 6px -1px var(--st-playing); }
  .fr-text { flex: 1; min-width: 0; }
  .fr-text > b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fr-act { font-size: 11px; color: var(--st-offline); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fr-act.online { color: var(--st-online); }
  .fr-act.play { color: var(--st-playing); }
  .fr-act.play b { font-weight: 700; }
  .fr-empty { padding: 8px; font-size: 12px; color: var(--lightbrown); }
  .fr-group { padding: 8px 4px 2px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--lightbrown); }
  .fr-group:first-child { padding-top: 2px; }
  #invite-bar { display: flex; align-items: center; gap: 8px; padding: 7px 8px; background: var(--almostwhite); border-bottom: 1px solid var(--vl-border); font-size: 12px; }
  #invite-bar[hidden] { display: none; }
  #invite-bar img { width: 24px; height: 24px; object-fit: cover; border: 1px solid var(--gray); flex: none; }
  #invite-bar b { color: var(--st-playing); }
  .fr-line { display: flex; align-items: center; gap: 4px; }
  .fr-line .fr-row { flex: 1; min-width: 0; }
  .fr-invite { flex: none; height: 24px; padding: 0 8px; font-size: 12px; }
  #main { flex: 1; min-width: 0; }
  #people-root.people { width: auto; max-height: none; flex: 1; }
</style>
</head>
<body>
<div id="frame" class="stars">
  <header id="titlebar" data-drag>
    <div class="tb-brand"><img src="../assets/hyperfocus.png" alt=""><b>FRIENDS</b><span>:: hyperfocus</span></div>
    <div class="tb-right">
      <button id="btn-min" class="tbtn" title="Minimize"></button>
      <button id="btn-close" class="tbtn close" title="Close"></button>
    </div>
  </header>
  <div id="wrap">
    <div class="box" id="side"><div class="box-h">friends</div><div id="invite-bar" hidden></div><div id="fr-list"></div></div>
    <div class="box" id="main"><div class="box-h">people</div><div id="people-root" class="people"></div></div>
  </div>
</div>
<script src="icons.js"></script>
<script src="drag.js"></script>
<script src="profile-ui.js"></script>
<script src="friends.js"></script>
</body>
</html>
