<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Hyperfocus Voice HUD</title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { background: transparent; cursor: default; }
  #hud { position: fixed; top: 0; left: 0; display: flex; flex-direction: column; gap: 7px; padding: 8px; opacity: .85; }
  .hu { display: flex; align-items: center; gap: 8px; }
  .hu .pic { position: relative; width: 32px; height: 32px; flex: none; border-radius: 0; transition: box-shadow 60ms linear; }
  .hu .pic .pfp { width: 32px; height: 32px; border-radius: 0; }
  .hu .nm {
    max-width: 180px; padding: 3px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000;
    background: rgba(17, 17, 27, .78); border: 1px solid rgba(255, 255, 255, .08); border-radius: 3px;
  }
  .hu.me .nm { color: var(--pink); }
  .hu.off .pic .pfp { filter: grayscale(.6) brightness(.7); }
  .hu .flag { display: grid; color: var(--light-red); }
  .hu .flag svg { width: 14px; height: 14px; filter: drop-shadow(0 1px 1px #000); }
</style>
</head>
<body>
<div id="hud"></div>
<script src="icons.js"></script>
<script src="voicehud.js"></script>
</body>
</html>
