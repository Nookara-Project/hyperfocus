<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Hyperfocus achievement</title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { background: transparent !important; overflow: hidden; }
  body { display: flex; align-items: flex-end; justify-content: center; height: 100vh; margin: 0; pointer-events: none; }
  #stage { position: relative; width: 480px; height: 332px; margin-bottom: 14px; }

  .ach {
    position: absolute; left: 0; right: 0; height: 104px; bottom: 0; transition: bottom .45s cubic-bezier(.2, .9, .3, 1); display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 12px; overflow: hidden;
    background: linear-gradient(135deg, rgba(30, 30, 46, .97), rgba(17, 17, 27, .97)); border: 2px solid var(--palegreen);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .55); transform: translateY(140%); opacity: 0;
  }
  .ach.in { animation: ach-in .7s cubic-bezier(.18, 1.25, .4, 1) forwards; }
  .ach.out, .ach.rare.out { animation: ach-out .5s ease forwards !important; }
  @keyframes ach-in { 0% { transform: translateY(140%) scale(.9); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes ach-out { from { transform: none; opacity: 1; } to { transform: scale(.96); opacity: 0; } }

  .ico { position: relative; width: 72px; height: 72px; flex: none; display: grid; place-items: center; background: var(--orange); border: 2px solid var(--gray); font-size: 36px; overflow: hidden; }
  .ico img { width: 100%; height: 100%; object-fit: cover; }
  .ach.in .ico { animation: ico-pop .8s .25s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes ico-pop { 0% { transform: scale(0) rotate(-25deg); } 100% { transform: none; } }

  .txt { flex: 1; min-width: 0; }
  .kick { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--palegreen); }
  .name { font-size: 19px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { font-size: 12px; color: var(--lightbrown); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game { font-size: 11px; color: var(--lightbrown); opacity: .8; margin-top: 2px; }
  .ach.in .txt > * { animation: txt-in .5s both; }
  .ach.in .kick { animation-delay: .35s; } .ach.in .name { animation-delay: .45s; } .ach.in .desc { animation-delay: .55s; } .ach.in .game { animation-delay: .6s; }
  @keyframes txt-in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }

  .ach::after { content: ""; position: absolute; top: 0; bottom: 0; width: 60%; left: -80%; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .18), transparent); }
  .ach.in::after { animation: sheen 1.1s .7s ease-out; }
  @keyframes sheen { to { left: 130%; } }

  .ach.rare { border-color: #f9e2af; }
  .ach.rare .kick { color: #f9e2af; }
  .ach.rare .ico { border-color: #f9e2af; box-shadow: 0 0 16px #f9e2af; }
  .ach.rare.in { animation: ach-in .7s cubic-bezier(.18, 1.25, .4, 1) forwards, rare-glow 1.6s .7s ease-in-out infinite; }
  @keyframes rare-glow {
    0%, 100% { box-shadow: 0 10px 30px rgba(0, 0, 0, .55), 0 0 14px #f9e2af66, inset 0 0 18px #f9e2af22; }
    50% { box-shadow: 0 10px 30px rgba(0, 0, 0, .55), 0 0 34px #f9e2afcc, inset 0 0 28px #f9e2af44; }
  }
  .ach.rare::before { content: ""; position: absolute; inset: -2px; pointer-events: none; opacity: .5;
    background: conic-gradient(from 0deg, transparent 0 70%, #f9e2af 80%, transparent 90%); animation: spin 2.4s linear infinite; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; padding: 2px; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .spark { position: absolute; width: 6px; height: 6px; background: #f9e2af; border-radius: 50%; box-shadow: 0 0 8px #f9e2af; opacity: 0; animation: spark 1.2s ease-out forwards; }
  @keyframes spark { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2); } }
</style>
</head>
<body>
<div id="stage"></div>
<script src="achievement.js"></script>
</body>
</html>
