<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; media-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Hyperfocus Overlay</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="mail-ui.css">
<link rel="stylesheet" href="voice-ui.css">
<link rel="stylesheet" href="profile-ui.css">
<style>
  #bg { position: fixed; inset: 0; overflow: hidden; background: rgba(8, 8, 16, .62); }
  #bg::before { opacity: .35; }

  .widget { position: fixed; z-index: 2; box-shadow: var(--vl-shadow); }
  .widget.dragging { z-index: 5; opacity: .92; }
  .widget > .box-h { cursor: move; display: flex; align-items: center; justify-content: space-between; }
  #w-user { top: 24px; left: 24px; width: 280px; }
  #w-game { top: 24px; left: 50%; transform: translateX(-50%); width: 440px; }
  #w-clock { top: 24px; right: 24px; min-width: 220px; }
  #w-friends { top: 150px; left: 24px; width: 260px; height: min(460px, calc(100vh - 260px)); }
  #w-msgs { top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(900px, 60vw); height: min(560px, 62vh); }
  #w-voice { top: 150px; right: 24px; width: 280px; }
  #w-profile { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; max-height: min(660px, 84vh); display: flex; flex-direction: column; }
  #w-profile[hidden] { display: none; }
  #ov-profile { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
  #w-bar { bottom: 24px; left: 50%; transform: translateX(-50%); }
  #w-media { bottom: 24px; left: 24px; width: 340px; }
  #w-ach { bottom: 24px; right: 24px; width: 340px; max-height: min(520px, calc(100vh - 220px)); display: flex; flex-direction: column; }
  #w-ach[hidden] { display: none; }
  #w-ach.perfect { border-color: #f9e2af; box-shadow: var(--vl-shadow), 0 0 14px #f9e2af55; }
  #w-ach.perfect > .box-h { background: #f9e2af; color: #1e1e2e; letter-spacing: .5px; }
  #w-ach.perfect .oa-bar { display: none; }
  .oa-bar { flex: 1; max-width: 120px; height: 6px; margin-left: 10px; background: rgba(17, 17, 27, .7); border: 1px solid var(--gray); }
  .oa-bar > i { display: block; height: 100%; background: var(--palegreen); }
  #ov-ach { overflow-y: auto; min-height: 0; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .oa-row { display: flex; align-items: center; gap: 8px; padding: 4px; border: 1px solid transparent; }
  .oa-i { width: 38px; height: 38px; flex: none; object-fit: cover; display: grid; place-items: center; background: var(--orange); border: 1px solid var(--gray); font-weight: 700; }
  .oa-t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .oa-t b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .oa-d { font-size: 11px; color: var(--lightbrown); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .oa-m { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--lightbrown); }
  .oa-m .when { color: var(--palegreen); }
  .oa-m .rare { color: #f9e2af; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .oa-p { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--lightbrown); }
  .oa-p > i { flex: 1; height: 4px; background: rgba(17, 17, 27, .7); border: 1px solid var(--gray); }
  .oa-p > i > i { display: block; height: 100%; background: var(--vl); }
  .oa-row.locked .oa-i, .oa-row.locked b { opacity: .5; filter: grayscale(.8); }
  .oa-row.rare.on { border-color: #f9e2af; box-shadow: 0 0 8px #f9e2af66; }
  .oa-row.rare.on b { color: #f9e2af; }
  .oa-row.rare .oa-p > i > i { background: #f9e2af; }
  .mm-app { color: var(--lightbrown); font-weight: 400; font-size: 12px; }
  .mm { display: flex; gap: 12px; padding: 10px; }
  .mm-art { position: relative; width: 108px; height: 108px; flex: none; border: 1px solid var(--gray); background: var(--orange) url("../assets/stars.svg") repeat; display: grid; place-items: center; overflow: hidden; }
  .mm-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mm-art svg { width: 34px; height: 34px; color: var(--lightbrown); }
  .mm-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .mm-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mm-artist { margin-top: 2px; font-size: 13px; color: var(--lightbrown); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mm-prog { margin-top: auto; height: 6px; padding: 1px; background: var(--orange); border: 1px solid var(--gray); }
  .mm-prog i { display: block; height: 100%; width: 0; background: var(--palegreen); transition: width .5s linear; }
  .mm-times { display: flex; justify-content: space-between; margin-top: 3px; font-size: 11px; color: var(--lightbrown); font-variant-numeric: tabular-nums; }
  .mm-ctrls { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 6px; }
  .mm-btn { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 1px solid var(--gray); border-radius: 50%; background: var(--almostwhite); color: var(--darkbrown); cursor: pointer; }
  .mm-btn:hover:not(:disabled) { border-color: var(--palegreen); color: var(--pink); }
  .mm-btn:disabled { opacity: .4; cursor: default; }
  .mm-btn svg { width: 14px; height: 14px; }
  .mm-btn.big { width: 42px; height: 42px; background: var(--palegreen); border-color: var(--palegreen); color: #000; }
  .mm-btn.big:hover:not(:disabled) { color: #000; filter: brightness(1.08); }
  .mm-btn.big svg { width: 18px; height: 18px; }

  .ov-card { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 72px; }
  .ov-name { font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-sub { font-size: 13px; color: var(--lightbrown); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .ov-icon { width: 52px; height: 52px; object-fit: cover; flex: none; border: 1px solid var(--gray); }
  .ov-clock { justify-content: flex-end; text-align: right; }
  #ov-time { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .ov-flist { flex: 1; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 4px; }
  .fr { display: flex; align-items: center; gap: 8px; padding: 4px; border: 1px solid var(--gray); background: transparent; width: 100%; text-align: left; }
  .fr:hover { background: var(--orange); }
  .fr.off { opacity: .55; }
  .fr b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fr-text { flex: 1; min-width: 0; }
  .fr-text b { display: block; }
  .fr-act { font-size: 11px; color: var(--online); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot.play { background: var(--pink); }
  .fr-line { display: flex; gap: 4px; }
  .fr-line .fr { flex: 1; min-width: 0; }
  .fr-msg { width: 30px; flex: none; display: grid; place-items: center; padding: 0; border: 1px solid var(--gray); background: transparent; color: var(--lightbrown); cursor: pointer; }
  .fr-msg:hover { background: var(--orange); color: var(--pink); }
  .fr-msg svg { width: 15px; height: 15px; }
  .fr-msg.fr-game-invite { width: auto; min-width: 44px; padding: 0 5px; font-size: 11px; }
  .fr-msg.fr-join { background: var(--orange); color: var(--pink); border-color: var(--orange); }
  .ov-empty { color: var(--lightbrown); padding: 8px; font-size: 13px; }
  .fr-group { padding: 6px 4px 1px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--lightbrown); }
  #mail-root { flex: 1; min-height: 0; padding: 10px; position: relative; }
  .m-x { width: 24px; height: 22px; border: 0; background: transparent; color: var(--darkbrown); display: grid; place-items: center; cursor: pointer; }
  .m-x:hover { background: var(--light-red); color: #fff; }
  .m-x svg { width: 15px; height: 15px; }
  .ov-bar { display: flex; align-items: center; gap: 8px; padding: 8px; }
  .ov-bar .btn { height: 30px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .ov-bar .btn svg { width: 15px; height: 15px; }
  .ov-bar .count { background: var(--pink); color: #000; border-radius: 8px; padding: 0 5px; font-size: 11px; font-weight: 700; }
  #ov-hint { color: var(--lightbrown); font-weight: 400; }
</style>
</head>
<body>
<div id="bg" class="stars"></div>

<div class="box widget" id="w-user"><div class="box-h">you</div><div class="ov-card" id="ov-user"></div></div>
<div class="box widget" id="w-game"><div class="box-h">now playing</div><div class="ov-card" id="ov-game"></div></div>
<div class="box widget" id="w-clock"><div class="box-h">time</div><div class="ov-card ov-clock"><div><div id="ov-time"></div><div class="ov-sub" id="ov-date"></div></div></div></div>
<div class="box widget" id="w-media" hidden>
  <div class="box-h"><span>music</span><span class="mm-app" id="mm-app"></span></div>
  <div class="mm">
    <div class="mm-art"><span id="mm-noart"></span><img id="mm-art" alt="" hidden></div>
    <div class="mm-info">
      <div class="mm-title" id="mm-title"></div>
      <div class="mm-artist" id="mm-artist"></div>
      <div class="mm-prog"><i id="mm-bar"></i></div>
      <div class="mm-times"><span id="mm-pos">0:00</span><span id="mm-dur"></span></div>
      <div class="mm-ctrls">
        <button class="mm-btn" id="mm-prev" title="Previous"></button>
        <button class="mm-btn big" id="mm-play" title="Play / pause"></button>
        <button class="mm-btn" id="mm-next" title="Next"></button>
      </div>
    </div>
  </div>
</div>
<div class="box widget" id="w-voice"><div class="box-h">voice chat</div><div id="voice-root"></div></div>
<div class="box widget" id="w-ach" hidden><div class="box-h"><span id="ov-ach-h">achievements</span><i class="oa-bar"><i id="ov-ach-bar"></i></i></div><div id="ov-ach"></div></div>
<div class="box widget" id="w-friends"><div class="box-h">friends</div><div class="ov-flist" id="ov-friends"></div></div>
<div class="box widget" id="w-profile" hidden>
  <div class="box-h"><span>profile</span><button class="m-x" id="ov-profile-x" title="Close profile"></button></div>
  <div id="ov-profile"></div>
</div>
<div class="box widget" id="w-msgs" hidden>
  <div class="box-h"><span>messages</span><button class="m-x" id="ov-msgs-x" title="Close messages"></button></div>
  <div id="mail-root"></div>
</div>
<div class="box widget" id="w-bar">
  <div class="box-h"><span>hyperfocus</span><span id="ov-hint"></span></div>
  <div class="ov-bar">
    <button class="btn" id="ov-open-msgs"></button>
    <button class="btn ghost" id="ov-pop" title="Open messages in their own window"></button>
    <button class="btn danger" id="ov-endgame" hidden></button>
    <button class="btn ghost" id="ov-launcher"></button>
    <button class="btn ghost" id="ov-reset" title="Put the widgets back where they started"></button>
    <button class="btn ghost" id="ov-close"></button>
  </div>
</div>

<script src="icons.js"></script>
<script src="mail-ui.js"></script>
<script src="voice-ui.js"></script>
<script src="profile-ui.js"></script>
<script src="overlay.js"></script>
<script src="gamepad.js"></script>
</body>
</html>
